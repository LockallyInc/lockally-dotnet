  /v1/send:
    post:
      description: |
        Submits an email for delivery via lockally. Returns 202 immediately
        once the message is accepted into lockally's queue; the actual SMTP
        submission to the recipient is async. Track delivery via
        `GET /v1/messages/{id}` or webhook subscriptions for
        `delivery.delivered` / `delivery.bounced` / `delivery.complaint`.

        **Idempotency-Key required.** Per design L7 — any unique string per
        send, 24-hour dedupe window. Repeated calls with the same key
        return byte-exact the original response and do NOT create a
        duplicate message.

        **Sender authorisation.** `from` must be a non-disabled mailbox
        owned by the calling tenant on a verified domain. Sending from
        aliases is not yet supported.

        **Rate cap.** Per-tenant `rate_cap_per_min` (returned on
        `/v1/tenant`) is enforced — 429 with `Retry-After: 60` once tripped.

        **Recipient warning.** Over 25 total recipients (To+Cc+Bcc) sets a
        `warning` field in the response — large fan-outs queue noticeably
        at scale. Hard cap is 100/send.
      parameters:
      - explode: false
        in: header
        name: Idempotency-Key
        required: true
        schema:
          maxLength: 255
          type: string
        style: simple
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/_v1_send_post_request"
        required: true
      responses:
        "202":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/_v1_send_post_202_response"
          description: Queued.
          headers:
            Idempotent-Replay:
              description: '"true" when the response is replayed from the idempotency
                cache.'
              explode: false
              schema:
                type: string
              style: simple
        "400":
          $ref: "#/components/responses/ProblemBadRequest"
        "401":
          $ref: "#/components/responses/ProblemUnauthorized"
        "403":
          $ref: "#/components/responses/ProblemForbidden"
        "429":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: Per-tenant rate cap exceeded.
          headers:
            Retry-After:
              explode: false
              schema:
                default: 60
                type: integer
              style: simple
      summary: Send an email
      tags:
      - send
      x-required-scope: send:write
  /v1/send/batch:
    post:
      description: |
        Sends up to 500 messages in one call. Each is validated and enqueued
        independently — a bad message fails only its own slot (partial success,
        HTTP 200). One `Idempotency-Key` header covers the batch; per-message
        keys are derived as `<key>:<index>`.
      parameters:
      - explode: false
        in: header
        name: Idempotency-Key
        required: true
        schema:
          maxLength: 200
          type: string
        style: simple
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/_v1_send_batch_post_request"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/_v1_send_batch_post_200_response"
          description: Per-message results (partial success).
        "400":
          $ref: "#/components/responses/ProblemBadRequest"
        "401":
          $ref: "#/components/responses/ProblemUnauthorized"
        "403":
          $ref: "#/components/responses/ProblemForbidden"
      summary: Send a batch of emails
      tags:
      - send
      x-required-scope: send:write
