  securitySchemes:
    bearerAuth:
      bearerFormat: lk_live_<prefix>_<secret>
      description: "API key, format `lk_live_<8-char-prefix>_<32-char-secret>`."
      scheme: bearer
      type: http
    oauth2:
      description: |
        OAuth 2.1 (authorization code + PKCE). The access token is sent as the
        `Authorization: Bearer` credential, exactly like an API key — so any SDK
        that accepts a bearer token works with OAuth. Discovery:
        `/.well-known/oauth-authorization-server`.
      flows:
        authorizationCode:
          authorizationUrl: https://api.lockally.com/oauth/authorize
          scopes:
            inboxes:read: Read agent-accessible mailboxes and threads
            inboxes:write: Send and act on agent-accessible mailboxes
          tokenUrl: https://api.lockally.com/oauth/token
      type: oauth2

