        required: true
      responses:
        "201":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Webhook"
          description: Created. `signing_secret` is in the response ONLY here.
        "400":
          $ref: "#/components/responses/ProblemBadRequest"
        "401":
