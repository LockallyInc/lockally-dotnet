openapi: 3.1.0
info:
  contact:
    email: support@lockally.com
    name: lockally support
  description: |
    The lockally control plane lets integrators and direct customers manage
    everything except actual mail data flow (which uses standard JMAP / IMAP /
    SMTP-submission against the data plane endpoints).

    **Authentication.** All `/v1/*` endpoints require a Bearer API key in the
    `Authorization` header. Keys are formatted `lk_live_<8-char-prefix>_<32-char-secret>`.
    Generate the first key for a tenant via `cmd/seed`; subsequent keys via
    `POST /v1/api-keys`.

    **Errors.** Failures return [RFC 9457](https://www.rfc-editor.org/rfc/rfc9457)
    `application/problem+json` documents.

    **Scopes.** Each endpoint requires a specific scope on the presented key.
    Insufficient scope returns `403` with the required scope name in `detail`.
  license:
    name: AGPL-3.0-only OR LicenseRef-LOC-Commercial
  title: lockally control plane
  version: 0.1.0
servers:
- description: Production
  url: https://api.lockally.com
- description: Local development / spike
  url: http://127.0.0.1:8081
security:
- bearerAuth: []
tags:
- description: Liveness checks
  name: health
- description: "AI-native agent surface: inboxes, threads, drafts, grants (per-mailbox\
    \ authorization)"
  name: agents
- description: Metered LLM features (thread classification; BYOK or prepaid AI units)
  name: ai
- description: Test mode (lk_test_* keys)
  name: test
- description: Operations on the calling tenant
  name: tenant
- description: API key lifecycle
  name: api-keys
- description: Tenant-owned mail domains and DNS verification
  name: domains
- description: Mailboxes on verified tenant domains
  name: mailboxes
- description: Email aliases (forwarders) on verified tenant domains
  name: aliases
- description: "Programmatic outbound mail (single, batch, scheduled, templated) +\
    \ delivery stats"
  name: send
- description: "Reusable email templates with {{variable}} substitution"
  name: templates
- description: "Suppression list — recipients Lockally won't mail (unsubscribes, complaints,\
    \ hard bounces)"
  name: suppressions
- description: HMAC-signed event subscriptions
  name: webhooks
- description: Tenant-admin login (email+password → session token for app.lockally.com)
  name: admin
- description: "Tenant-admin team management (invite, list, disable, delete)"
  name: admins
- description: End-user (mailbox user) lifecycle
  name: users
- description: "Plan, subscription checkout, and send-unit purchases"
  name: billing
- description: "Paid add-on features (activation, cancellation)"
  name: add-ons
- description: Internal distribution / mailing lists
  name: distribution-lists
- description: "Calendars, events, members, policies, security, and integrations"
  name: calendars
- description: "Bookable resources (meeting rooms, equipment)"
  name: resources
- description: Contact records (internal and external)
  name: contacts
- description: Contact list management and membership
  name: contact-lists
- description: "Global address list (GAL), directory permissions, stats"
  name: directory
- description: End-to-end encryption key management
  name: encryption
- description: IP pool assignment and dedicated IP requests
  name: ip-pools
- description: "Tenant dashboard: user insights, audit, integrations, health, security,\
    \ storage"
  name: dashboard
- description: "Email migration from external providers (IMAP, Google, Microsoft)"
  name: migrations
- description: "Self-serve tenant registration (public, no auth)"
  name: signup
- description: Agent draft review and approval (HITL)
  name: drafts
paths:
  /healthz:
    get:
      description: Returns 200 if the process is up and the database pings cleanly.
        No authentication required.
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/_healthz_get_200_response"
          description: Healthy
        "503":
          $ref: "#/components/responses/ProblemServiceUnavailable"
      security: []
      summary: Liveness check
      tags:
      - health
  /v1/tenant:
    get:
      description: Returns the tenant the presented API key belongs to.
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Tenant"
          description: Tenant info
        "401":
          $ref: "#/components/responses/ProblemUnauthorized"
        "403":
          $ref: "#/components/responses/ProblemForbidden"
      summary: Get the calling tenant
      tags:
      - tenant
      x-required-scope: tenant:read
  /v1/usage:
    get:
      description: |
        Returns the tenant's current usage + cap consumption. Designed for
        poll-based alerting on the integrator side (e.g. "warn when daily
        quota is 80% used"). Refreshed live from Postgres — there is no
        cache, so callers should poll at most once per minute.
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/_v1_usage_get_200_response"
          description: Usage snapshot
        "401":
          $ref: "#/components/responses/ProblemUnauthorized"
        "403":
          $ref: "#/components/responses/ProblemForbidden"
      summary: Usage snapshot
      tags:
      - tenant
      x-required-scope: tenant:read
  /v1/api-keys:
    get:
      description: |
        Returns all API keys (active and revoked) belonging to the calling
        tenant. The `secret` is **never** returned — only prefix + metadata.
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/_v1_api_keys_get_200_response"
          description: Key list
        "401":
          $ref: "#/components/responses/ProblemUnauthorized"
        "403":
          $ref: "#/components/responses/ProblemForbidden"
      summary: List API keys
      tags:
      - api-keys
      x-required-scope: tenant:admin
    post:
      description: |
        Provisions a fresh API key for the calling tenant.

        **The full `secret` is included in this response ONLY** — store it
        immediately. The cleartext secret is not recoverable from the
        argon2id hash kept server-side; rotate by creating a new key and
        revoking the old one.
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/_v1_api_keys_post_request"
        required: true
      responses:
        "201":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/_v1_api_keys_post_201_response"
          description: Key created — `secret` is in the response and shown only here.
        "400":
          $ref: "#/components/responses/ProblemBadRequest"
        "401":
          $ref: "#/components/responses/ProblemUnauthorized"
        "403":
          $ref: "#/components/responses/ProblemForbidden"
      summary: Create an API key
      tags:
      - api-keys
      x-required-scope: tenant:admin
  /v1/domains:
    get:
      description: Returns every domain registered under the calling tenant.
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/_v1_domains_get_200_response"
          description: Domain list
        "401":
          $ref: "#/components/responses/ProblemUnauthorized"
        "403":
          $ref: "#/components/responses/ProblemForbidden"
      summary: List domains
      tags:
      - domains
      x-required-scope: domains:read
    post:
      description: |
        Registers a new domain for the calling tenant. Generates a DKIM
        keypair and verification token. Returns DNS instructions the tenant
        must publish under their own DNS (verification TXT, SPF include,
        DKIM TXT, MX records to `mx1`/`mx2.lockally.com`, DMARC seed).

        **Idempotent** — re-posting the same domain returns the existing
        record with the same DKIM keys and token (regenerating would break
        the tenant's published DNS). Returns 200 on idempotent hit, 201 on
        first create.

        Returns 409 if the domain is already claimed by a different tenant.
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/_v1_domains_post_request"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Domain"
          description: Domain already registered to the calling tenant (idempotent).
        "201":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Domain"
          description: Domain created.
        "400":
          $ref: "#/components/responses/ProblemBadRequest"
        "401":
          $ref: "#/components/responses/ProblemUnauthorized"
        "403":
          $ref: "#/components/responses/ProblemForbidden"
        "409":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: Domain claimed by another tenant.
      summary: Register a domain
      tags:
      - domains
      x-required-scope: domains:write
  /v1/domains/{domain}:
    delete:
      description: |
        Removes the domain registration. Refuses with 409 if any mailbox is
        still attached — delete the mailboxes first.
      parameters:
      - explode: false
        in: path
        name: domain
        required: true
        schema:
          format: hostname
          type: string
        style: simple
      responses:
        "204":
          description: Deleted.
        "401":
          $ref: "#/components/responses/ProblemUnauthorized"
        "403":
          $ref: "#/components/responses/ProblemForbidden"
        "404":
          $ref: "#/components/responses/ProblemNotFound"
        "409":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: Domain still has mailboxes attached.
      summary: Delete a domain
      tags:
      - domains
      x-required-scope: domains:write
    get:
      parameters:
      - explode: false
        in: path
        name: domain
        required: true
        schema:
          format: hostname
          type: string
        style: simple
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Domain"
          description: Domain record including the DNS instructions to publish.
        "401":
          $ref: "#/components/responses/ProblemUnauthorized"
        "403":
          $ref: "#/components/responses/ProblemForbidden"
        "404":
          $ref: "#/components/responses/ProblemNotFound"
      summary: Get a domain
      tags:
      - domains
      x-required-scope: domains:read
  /v1/domains/{domain}/verify:
    post:
      description: |
        Synchronously checks the `_lockally-verify.<domain>` TXT record
        against the stored verification token. Returns 200 either way:
        the returned `verified` boolean tells you whether DNS now confirms.
        Caller polls until `verified: true`. In v2 a background worker
        auto-polls and fires a `domain.verified` webhook.
      parameters:
      - explode: false
        in: path
        name: domain
        required: true
        schema:
          format: hostname
          type: string
        style: simple
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Domain"
          description: Current domain state (possibly newly verified).
        "401":
          $ref: "#/components/responses/ProblemUnauthorized"
        "403":
          $ref: "#/components/responses/ProblemForbidden"
        "404":
          $ref: "#/components/responses/ProblemNotFound"
        "502":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: "Upstream DNS error (timeout, server unreachable). Retry."
      summary: Force-poll DNS verification
      tags:
      - domains
      x-required-scope: domains:write
  /v1/mailboxes:
    get:
      description: |
        Returns mailboxes under the calling tenant — active and soft-deleted.
        `?limit=N` between 1 and 200 (default 50).
      parameters:
      - explode: true
        in: query
        name: limit
        required: false
        schema:
          default: 50
          maximum: 200
          minimum: 1
          type: integer
        style: form
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/_v1_mailboxes_get_200_response"
          description: Mailbox list.
        "401":
          $ref: "#/components/responses/ProblemUnauthorized"
        "403":
          $ref: "#/components/responses/ProblemForbidden"
      summary: List mailboxes
      tags:
      - mailboxes
      x-required-scope: mailboxes:read
    post:
      description: |
        Creates a mailbox on a tenant-verified domain. If `password` is
        omitted, lockally generates a 16-char password and returns it in the
        response — shown once.

        **Gate.** The mailbox's domain must already be registered AND
        verified for this tenant (via `/v1/domains` + `/v1/domains/{domain}/verify`).

        **Idempotent.** Re-posting the same email returns the existing
        mailbox UNTOUCHED — password is NOT regenerated. To change a
        password, use PATCH instead.
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/_v1_mailboxes_post_request"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Mailbox"
          description: Mailbox already existed for this tenant (idempotent).
        "201":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Mailbox"
          description: Mailbox created. `password` is in the response ONLY if generated.
        "400":
          $ref: "#/components/responses/ProblemBadRequest"
        "401":
          $ref: "#/components/responses/ProblemUnauthorized"
        "403":
          $ref: "#/components/responses/ProblemForbidden"
        "409":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: Email claimed by another tenant.
      summary: Create a mailbox
      tags:
      - mailboxes
      x-required-scope: mailboxes:write
  /v1/mailboxes/{email}:
    delete:
      description: |
        Sets `soft_deleted_at = now()` and `hard_delete_after = now() + 90d`
        per design D25. A background sweep (planned) will hard-delete after
        the window. The mailbox is also disabled immediately.
      parameters:
      - explode: false
        in: path
        name: email
        required: true
        schema:
          format: email
          type: string
        style: simple
      responses:
        "204":
          description: Soft-deleted.
        "401":
          $ref: "#/components/responses/ProblemUnauthorized"
        "403":
          $ref: "#/components/responses/ProblemForbidden"
        "404":
          $ref: "#/components/responses/ProblemNotFound"
      summary: Soft-delete a mailbox
      tags:
      - mailboxes
      x-required-scope: mailboxes:write
    get:
      parameters:
      - explode: false
        in: path
        name: email
        required: true
        schema:
          format: email
          type: string
        style: simple
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Mailbox"
          description: Mailbox info.
        "401":
          $ref: "#/components/responses/ProblemUnauthorized"
        "403":
          $ref: "#/components/responses/ProblemForbidden"
        "404":
          $ref: "#/components/responses/ProblemNotFound"
      summary: Get a mailbox
      tags:
      - mailboxes
      x-required-scope: mailboxes:read
    parameters:
    - explode: false
      in: path
      name: email
      required: true
      schema:
        format: email
        type: string
      style: simple
    patch:
      description: |
        Supply at least one of `password`, `quota_bytes`, `disabled`.
        Returns the updated mailbox.
      parameters:
      - explode: false
        in: path
        name: email
        required: true
        schema:
          format: email
          type: string
        style: simple
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/_v1_mailboxes__email__patch_request"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Mailbox"
          description: Updated mailbox.
        "400":
          $ref: "#/components/responses/ProblemBadRequest"
        "401":
          $ref: "#/components/responses/ProblemUnauthorized"
        "403":
          $ref: "#/components/responses/ProblemForbidden"
        "404":
          $ref: "#/components/responses/ProblemNotFound"
      summary: Update a mailbox
      tags:
      - mailboxes
      x-required-scope: mailboxes:write
  /v1/mailboxes/{email}/export:
    parameters:
    - explode: false
      in: path
      name: email
      required: true
      schema:
        type: string
      style: simple
    post:
      description: |
        Issues a one-shot "presigned" download URL for the mailbox's content
        in mbox format. The URL works without an Authorization header — the
        token in the query string is the authz. TTL is 5 minutes; the token
        is consumed on first GET.

        **v1 caveat:** the synthesized mbox only contains outbound mail
        (from `lockally.messages`). v2 swaps in Stalwart's export primitive
        for full inbox + folder structure + flags. The endpoint contract
        stays unchanged.
      parameters:
      - explode: false
        in: path
        name: email
        required: true
        schema:
          type: string
        style: simple
      responses:
        "201":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/_v1_mailboxes__email__export_post_201_response"
          description: Export token issued.
        "401":
          $ref: "#/components/responses/ProblemUnauthorized"
        "403":
          $ref: "#/components/responses/ProblemForbidden"
        "404":
          $ref: "#/components/responses/ProblemNotFound"
      summary: Request a mailbox export
      tags:
      - mailboxes
      x-required-scope: mailboxes:read
  /v1/mailboxes/{email}/export/download:
    get:
      description: |
        Public endpoint (no Authorization header). Validates the one-shot
        token from the URL, marks it used, and streams an mbox file. Second
        GET with the same token returns 404 — tokens are single-use.
      parameters:
      - explode: false
        in: path
        name: email
        required: true
        schema:
          type: string
        style: simple
      - explode: true
        in: query
        name: token
        required: true
        schema:
          type: string
        style: form
      responses:
        "200":
          content:
            application/mbox:
              schema:
                format: binary
                type: string
          description: mbox stream.
        "400":
          $ref: "#/components/responses/ProblemBadRequest"
        "403":
          $ref: "#/components/responses/ProblemForbidden"
        "404":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: "Token not found, already used, or expired."
      security: []
      summary: Download a previously-issued mailbox export
      tags:
      - mailboxes
    parameters:
    - explode: false
      in: path
      name: email
      required: true
      schema:
        type: string
      style: simple
    - explode: true
      in: query
      name: token
      required: true
      schema:
        type: string
      style: form
  /v1/aliases:
    get:
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/_v1_aliases_get_200_response"
          description: Alias list.
        "401":
          $ref: "#/components/responses/ProblemUnauthorized"
        "403":
          $ref: "#/components/responses/ProblemForbidden"
      summary: List aliases
      tags:
      - aliases
      x-required-scope: mailboxes:read
    post:
      description: |
        Creates an email alias. `alias_address` must be on a verified
        tenant-owned domain. `alias_target` can be any email — intra-tenant
        or external (forwarding to a Gmail account is a legitimate use).
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/_v1_aliases_post_request"
        required: true
      responses:
        "201":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Alias"
          description: Alias created.
        "400":
          $ref: "#/components/responses/ProblemBadRequest"
        "401":
          $ref: "#/components/responses/ProblemUnauthorized"
        "403":
          $ref: "#/components/responses/ProblemForbidden"
        "409":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: Alias address already exists.
      summary: Create an alias
      tags:
      - aliases
      x-required-scope: mailboxes:write
  /v1/aliases/{address}:
    delete:
      description: Hard-delete (no soft-delete window — aliases are cheap to recreate).
      parameters:
      - explode: false
        in: path
        name: address
        required: true
        schema:
          format: email
          type: string
        style: simple
      responses:
        "204":
          description: Deleted.
        "401":
          $ref: "#/components/responses/ProblemUnauthorized"
        "403":
          $ref: "#/components/responses/ProblemForbidden"
        "404":
          $ref: "#/components/responses/ProblemNotFound"
      summary: Delete an alias
      tags:
      - aliases
      x-required-scope: mailboxes:write
  /v1/admin/login:
    post:
      description: |
        Exchanges an admin's email + password for a session token. The web
        console at `app.lockally.com` posts this on form submission and
        stores the returned token in an httpOnly cookie.

        **No enumeration leak.** Wrong-email and wrong-password both return
        the same 401 with title "Invalid credentials". The argon2id verify
        runs even on lookup miss (well, structurally — the lookup fails fast
        but the response shape is constant) so timing leaks are bounded.

        Tokens are prefixed `adm_sess_` and valid for 7 days. Use as the
        `Authorization: Bearer` value on all subsequent calls.
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/_v1_admin_login_post_request"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/_v1_admin_login_post_200_response"
          description: Authenticated.
        "400":
          $ref: "#/components/responses/ProblemBadRequest"
        "401":
          $ref: "#/components/responses/ProblemUnauthorized"
        "403":
          $ref: "#/components/responses/ProblemForbidden"
      security: []
      summary: Tenant-admin email+password login
      tags:
      - admin
  /v1/admin/logout:
    post:
      description: |
        Deletes the session row from the database. Idempotent — calling
        logout on an already-invalid token returns 204 anyway.
      responses:
        "204":
          description: Logged out.
        "400":
          $ref: "#/components/responses/ProblemBadRequest"
        "401":
          $ref: "#/components/responses/ProblemUnauthorized"
      summary: Invalidate the current admin session
      tags:
      - admin
  /v1/admin/me:
    get:
      description: |
        Returns the admin profile + tenant for the session token presented
        in `Authorization: Bearer`. Used by the web console's layout load
        function to populate the sidebar.

        Returns 403 if called with an API key (lk_live_*) bearer — admin
        context only exists for session tokens.
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/_v1_admin_me_get_200_response"
          description: Admin + tenant.
        "401":
          $ref: "#/components/responses/ProblemUnauthorized"
        "403":
          $ref: "#/components/responses/ProblemForbidden"
      summary: Get the current admin + tenant
      tags:
      - admin
  /v1/admins:
    get:
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/_v1_admins_get_200_response"
          description: Admin list.
        "401":
          $ref: "#/components/responses/ProblemUnauthorized"
        "403":
          $ref: "#/components/responses/ProblemForbidden"
      summary: List tenant admins
      tags:
      - admins
      x-required-scope: tenant:admin
    post:
      description: |
        Creates a new tenant admin. If `password` is omitted, lockally
        generates a 16-char password and returns it ONCE in the response.
        Email is case-insensitive and unique per tenant.
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/_v1_admins_post_request"
        required: true
      responses:
        "201":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminFull"
          description: Created. `password` populated ONLY if generated.
        "400":
          $ref: "#/components/responses/ProblemBadRequest"
        "401":
          $ref: "#/components/responses/ProblemUnauthorized"
        "403":
          $ref: "#/components/responses/ProblemForbidden"
        "409":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: Email already an admin on this tenant.
      summary: Invite a new admin
      tags:
      - admins
      x-required-scope: tenant:admin
  /v1/admins/{id}:
    delete:
      description: |
        Hard-delete. Cascade-drops the admin's sessions (immediate
        revocation). Same safety rails as PATCH disabled=true.
      parameters:
      - explode: false
        in: path
        name: id
        required: true
        schema:
          format: uuid
          type: string
        style: simple
      responses:
        "204":
          description: Deleted.
        "401":
