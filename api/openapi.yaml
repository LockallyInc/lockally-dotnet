components:
  responses:
    ProblemBadRequest:
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
      description: Malformed request.
    ProblemUnauthorized:
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
      description: "Missing, malformed, or invalid API key."
    ProblemForbidden:
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
      description: API key lacks the required scope.
    ProblemNotFound:
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
      description: Resource not found under the calling tenant.
    ProblemServiceUnavailable:
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
      description: Service is temporarily unable to handle the request (e.g. database
        unreachable).
  schemas:
    SendMessage:
      properties:
        from:
          format: email
          type: string
        to:
          items:
            format: email
            type: string
          minItems: 1
          type: array
          default: null
        cc:
          items:
            format: email
            type: string
          type: array
          default: null
        bcc:
          items:
            format: email
            type: string
          type: array
          default: null
        subject:
          type: string
        text:
          type: string
        html:
          type: string
        headers:
          additionalProperties:
            type: string
        unsubscribe:
          type: boolean
        template_id:
          format: uuid
          type: string
        variables:
          additionalProperties:
            type: string
        send_at:
          format: date-time
          type: string
        attachments:
          items:
            $ref: "#/components/schemas/_v1_send_post_request_attachments_inner"
          type: array
          default: null
      required:
      - from
      - to
    BatchResult:
      example:
        index: 0
        id: 046b6c7f-0b8a-43b9-b35d-6489e6daee91
        message_id: message_id
        status: queued
        error: error
      properties:
        index:
          type: integer
        id:
          format: uuid
          type: string
        message_id:
          type: string
        status:
          enum:
          - queued
          - scheduled
          - suppressed
          type: string
        error:
          description: Present when this message failed; the others are then absent.
          type: string
    Template:
      example:
        id: 046b6c7f-0b8a-43b9-b35d-6489e6daee91
        name: name
        subject: subject
